# 解析 Schema：驱动日志解析的可配置层。
# 字段契约（稳定）：正则捕获组必须使用这些规范名，改格式只改 pattern，不改代码。
#   Actor 记录:   actor_type(string) actor_size(int) self(pid) parent(pid)
#   Message 记录: msg_type(string) msg_size(int) sender(pid) self(pid) parent(pid)
#   PID 字段:     Address(string) Id(string) GroupID(int) Master(pid, 递归, 可为 nil)
#
# 注意：pattern 用单引号单行标量书写，避免 YAML 折叠标量把换行折成空格破坏正则。
version: 1

records:
  actor:
    pattern: '^\[ACTOR\]\s+INFO\s+Actor\s+statistics统计\s+ActorType="(?P<actor_type>[^"]*)"\s+ActorSize=(?P<actor_size>\d+)\s+Self="(?P<self>[^"]*)"\s+Parent="(?P<parent>[^"]*)"\s*$'
    fields:
      actor_type: string
      actor_size: int
      self: pid
      parent: pid

  message:
    pattern: '^\[ACTOR\]\s+INFO\s+Receive统计\s+MsgType="(?P<msg_type>[^"]*)"\s+MsgSize=(?P<msg_size>\d+)\s+Sender="(?P<sender>[^"]*)"\s+Self="(?P<self>[^"]*)"\s+Parent="(?P<parent>[^"]*)"\s*$'
    fields:
      msg_type: string
      msg_size: int
      sender: pid
      self: pid
      parent: pid

pid:
  null_literal: "nil"
  fields:
    Address: string
    Id: string
    GroupID: int
    Master: pid
